# BRIDGE variant of docker-compose.yml, to add on top:
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml …
#
# The service is published only on the host's loopback (127.0.0.1:8088). Limits (see
# docs/docker.md, "Host or bridge mode" and "Network under Docker"):
#   - no neighbors (ip neigh only sees the bridge), no mDNS, wrong default gateway (the
#     bridge's); ARP scanning stays possible through the companion (arp profile, in host mode);
#   - the admin login arrives from the GATEWAY of the compose network (172.31.88.1 below), neither
#     from loopback nor from a default admin network: init with
#       --listen 0.0.0.0 --admin-cidrs 172.31.88.1/32 --http-login
#     (HTTP login accepted: only because the port is published only on the host's 127.0.0.1;
#     otherwise, an HTTPS proxy and trustedProxies);
#   - open http://localhost:8088 (or 127.0.0.1): any other name requires allowedHosts.
# Compose network with a fixed subnet, so that adminCidrs is known in advance: on a conflict
# with an existing network, change subnet and gateway AND the --admin-cidrs option (or adminCidrs).
services:
  vigie:
    network_mode: !reset null
    ports:
      - "127.0.0.1:${VIGIE_PORT:-8088}:${VIGIE_PORT:-8088}"
  init:
    network_mode: !reset null

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.88.0/24
          gateway: 172.31.88.1
